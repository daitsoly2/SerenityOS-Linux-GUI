; File type -> icon mapping for GUI::FileIconProvider.
;
; Each key must have a matching resource icon "filetype-<key>.png" in
; Base/res/icons/{16x16,32x32}. Patterns are shell globs matched against the
; whole path, case-insensitively, in the order written here - the most specific
; pattern has to come first (e.g. *.tar.gz before *.gz).
;
; On the Linux port .exe / .af / .desktop never reach this table: they carry
; their own icon (PE resource / Icon= key) through PortShortcuts.
[Icons]
; --- source code ---------------------------------------------------------
asm=*.S,*.asm,*.nasm,*.inc
c=*.c
cplusplus=*.cpp,*.cxx,*.cc,*.c++,*.ino,*.ipp,*.tpp
header=*.h,*.hpp,*.hxx,*.hh,*.h++
cmake=*CMakeLists.txt,*CMakeCache.txt,*.cmake
zig=*.zig,*.zon
rust=*.rs
go=*.go
lua=*.lua
python=*.py,*.pyi,*.pyw,*.pyc,*.pyo,*.whl
ruby=*.rb,*.erb,*.rake,Gemfile,Rakefile
java=*.java,*.class,*.jar,*.kt,*.kts,*.gradle,*.scala,*.groovy
javascript=*.js,*.mjs,*.cjs,*.jsx,*.ts,*.tsx,*.vue,*.svelte,*.coffee
php=*.php,*.phtml,*.php3,*.php4,*.php5,*.phps
sql=*.sql,*.dsql,*.psql
shell=*.sh,*.bash,*.zsh,*.fish,*.ksh,*.command,*.ebuild,PKGBUILD
nix=*.nix
; --- markup / documents --------------------------------------------------
html=*.html,*.htm,*.xhtml,*.shtml
css=*.css,*.scss,*.sass,*.less,*.styl
markdown=*.md,*.markdown,*.mdx
text=*.txt,*.gmi,*.rst,*.nfo,*.adoc,*.org,*.tex,*.diff,*.patch,*.swift,*.dart,*.tf,*.hcl,*.mk,*Makefile,*GNUmakefile,*makefile,*meson.build,*build.ninja,*Dockerfile,*Containerfile,*LICENSE,*README,*CHANGELOG
log=*.log,*.journal,*.err
pdf=*.pdf
document=*.doc,*.docx,*.odt,*.rtf,*.pages,*.epub,*.mobi,*.azw3,*.chm,*.djvu
presenter=*.presenter,*.ppt,*.pptx,*.odp,*.key,*.pps
spreadsheet=*.sheets,*.csv,*.tsv,*.xls,*.xlsx,*.ods,*.numbers
calendar=*.cal,*.ics,*.vcs
; --- data / configuration ------------------------------------------------
json=*.json,*.jsonl,*.ndjson,*.ipynb,*.webmanifest,*.geojson
config=*.toml,*.yaml,*.yml,*.conf,*.cfg,*.config,*.env,*.service,*.properties,*.rules,*.list,*.editorconfig
ini=*.ini,*.directory,*.theme,*.reg
db=*.db,*.sqlite,*.sqlite3,*.mdb,*.accdb,*.dbf
wasm=*.wasm,*.wat
gml=*.gml
palette=*.palette
pixelpaint=*.pp
form=*.frm
git=*.gitignore,*.gitattributes,*.gitcredentials,*.mailmap,*.gitmodules,*.gitconfig,*.gitkeep
font=*.font
certificate=*.pem,*.crt,*.cer,*.der,*.key,*.csr,*.p12,*.pfx,*.gpg,*.asc,*.jks
; --- fonts ---------------------------------------------------------------
truetype=*.ttf,*.otf,*.woff,*.woff2,*.ttc,*.pfb,*.pfa,*.bdf,*.psf
; --- images --------------------------------------------------------------
image=*.png,*.jpg,*.jpeg,*.jpe,*.gif,*.bmp,*.tif,*.tiff,*.webp,*.avif,*.heic,*.heif,*.ico,*.svg,*.svgz,*.xcf,*.psd,*.kra,*.tga,*.dds,*.exr,*.hdr,*.jp2,*.jxl
model3d=*.stl,*.glb,*.gltf,*.fbx,*.blend,*.dae,*.ply,*.3ds,*.usd,*.usdz
; --- audio / video -------------------------------------------------------
sound=*.wav,*.flac,*.mp3,*.qoa,*.ogg,*.oga,*.opus,*.m4a,*.aac,*.wma,*.aiff,*.aif,*.ape,*.wv,*.mid,*.midi,*.mod,*.xm,*.s3m
video=*.avi,*.mkv,*.mov,*.mp4,*.m4v,*.webm,*.mpg,*.mpeg,*.wmv,*.flv,*.ogv,*.3gp,*.m2ts,*.vob,*.rmvb
; --- archives ------------------------------------------------------------
archive=*.tar.gz,*.tar.xz,*.tar.bz2,*.tar.zst,*.tar.lz4,*.tar,*.zip,*.gz,*.tgz,*.tbz2,*.txz,*.tzst,*.bz2,*.xz,*.zst,*.zstd,*.7z,*.rar,*.lz4,*.lzma,*.cab,*.cpio,*.z,*.arj,*.lha
; --- packages / disk images ----------------------------------------------
package=*.deb,*.rpm,*.apk,*.appimage,*.flatpak,*.snap,*.msi,*.pkg,*.xbps,*.nupkg,*.vsix
diskimage=*.iso,*.img,*.qcow2,*.qcow,*.vmdk,*.vdi,*.vhd,*.vhdx,*.dmg,*.sparseimage
; --- binaries ------------------------------------------------------------
executable=*.lnk,*.bat,*.cmd,*.com,*.scr,*.app
library=*.so,*.so.*,*.a,*.dylib,*.dll,*.lib,*.ko,*.rlib
object=*.o,*.obj,*.lo
